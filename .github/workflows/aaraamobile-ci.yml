name: Aaraamobile CI

on:
  push:
    branches:
      - feature-initial
      - hardening/**
      - develop
      - dev
      - main
    paths:
      - 'aaraakart/**'
      - '.github/workflows/aaraamobile-ci.yml'
  pull_request:
    paths:
      - 'aaraakart/**'
      - '.github/workflows/aaraamobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: aaraamobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aaraakart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test 2>/dev/null || dart format --output=none --set-exit-if-changed lib

      - name: Static analysis
        run: flutter analyze

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found yet; test execution skipped.'
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug
