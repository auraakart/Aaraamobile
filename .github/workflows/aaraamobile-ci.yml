name: Aaraamobile CI

on:
  push:
    branches:
      - feature-initial
      - hardening/**
      - develop
      - dev
      - main
    paths:
      - 'aaraakart/**'
      - 'brands/**'
      - '.github/scripts/**'
      - '.github/workflows/aaraamobile-ci.yml'
  pull_request:
    paths:
      - 'aaraakart/**'
      - 'brands/**'
      - '.github/scripts/**'
      - '.github/workflows/aaraamobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: aaraamobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aaraakart

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject privileged client-side secrets
        working-directory: .
        run: python3 .github/scripts/check_brand_secrets.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting of changed Dart files
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi

          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$base...HEAD" -- \
              'aaraakart/lib/**/*.dart' \
              'aaraakart/lib/*.dart' \
              'aaraakart/test/**/*.dart' \
              'aaraakart/test/*.dart'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed Dart files to format-check.'
            exit 0
          fi

          printf 'Formatting check files:\n%s\n' "${files[*]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Static analysis
        run: flutter analyze

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found yet; test execution skipped.'
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug
